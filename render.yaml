services:
  - type: web
    name: ufuk-cetintas-onay
    branch: codex/gumruk-paylasim-ucretsiz
    rootDir: automation
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /healthz
    envVars:
      - key: DATA_DIR
        value: /tmp/gumruk-onay
      - key: DEMO_MODE
        value: "true"
      - key: DATABASE_URL
        sync: false
      - key: INSTAGRAM_EXPECTED_USERNAME
        value: gumrukkocunuz
      - key: REVIEW_PANEL_PASSWORD
        generateValue: true
      - key: TOKEN_ENCRYPTION_KEY
        generateValue: true
