services:
  - type: web
    name: ufuk-cetintas-onay
    rootDir: automation
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: starter
    healthCheckPath: /healthz
    disk:
      name: onay-verileri
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: DATA_DIR
        value: /var/data
      - key: INSTAGRAM_EXPECTED_USERNAME
        value: gumrukkocunuz
      - key: REVIEW_PANEL_PASSWORD
        generateValue: true
      - key: TOKEN_ENCRYPTION_KEY
        generateValue: true
